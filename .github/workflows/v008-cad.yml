name: V009 structural-arm parametric CAD build and release artifacts
on:
  push:
    branches: [main]
    paths:
      - 'src/build.py'
      - 'src/frame_monitor/**'
      - 'tests/test_v009_outputs.py'
      - '.github/workflows/v009-cad.yml'
  pull_request:
    paths:
      - 'src/build.py'
      - 'src/frame_monitor/**'
      - 'tests/test_v009_outputs.py'
      - '.github/workflows/v009-cad.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v009-cad-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-validate-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CAD and headless rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1 libglib2.0-0
          python -m pip install -r requirements.txt
      - name: Build complete unified V009 assembly
        run: python src/build.py build
      - name: Validate two arm guides and cable clearance in 13 poses
        run: python src/build.py validate
      - name: Render three real geometry previews
        run: xvfb-run -a python src/build.py render
      - name: Gate all deliverables and metadata
        run: PYTHONPATH=src python tests/test_v009_outputs.py
      - name: Commit generated V009 artifacts to main after validation
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add step/V009_first_arm.step step/V009_second_arm.step step/COMPLETE_4040_ESP32_CAM_MB_ASSEMBLY_V009.step
          git add stl/V009_first_arm.stl stl/V009_second_arm.stl
          git add previews/v009_full_assembly.png previews/v009_cable_guides.png previews/v009_wrist_20_degrees.png
          git add docs/manifest_v009.json docs/validation_v009.json
          if git diff --cached --quiet; then
            echo 'V009 generated CAD artifacts already match the repository.'
          else
            git commit -m 'build(cad): publish verified unified V009 assembly and previews'
            git push origin HEAD:main
          fi
      - name: Upload V009 generated models and validation as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-CAM-MB-V009-verified-CAD
          if-no-files-found: error
          path: |
            step/*V009.step
            stl/V009_*.stl
            previews/v009_*.png
            docs/manifest_v009.json
            docs/validation_v009.json

name: Documentation and asset integrity
on:
  push:
  pull_request:
jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify README preview paths and archived source integrity
        run: python tests/test_repo_assets.py

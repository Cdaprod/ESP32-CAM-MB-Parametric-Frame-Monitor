name: V006 current CAD and tracked artifact release
on:
  push:
    branches: [main]
    paths:
      - 'src/build_v006.py'
      - 'src/validate_v006.py'
      - 'src/render_v006.py'
      - 'src/build_v005.py'
      - 'src/build_v004.py'
      - 'src/build_assembly.py'
      - 'src/v001_mount.py'
      - '.github/workflows/v006-cad.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v006-release-main
  cancel-in-progress: false
jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometric, mesh and rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1 libglib2.0-0
          python -m pip install 'cadquery>=2.4,<3' 'shapely>=2,<3' 'numpy>=1.26,<3' 'trimesh>=4,<5' 'matplotlib>=3.8,<4' 'vtk>=9.2,<10' 'pillow>=10,<13'
      - name: Regenerate assembly STEP and two printable STLs
        run: python src/build_v006.py
      - name: Verify 13 articulated poses and cable/knob clearance
        run: python src/validate_v006.py
      - name: Render three real-geometry PNGs
        run: xvfb-run -a python src/render_v006.py
      - name: Verify all required CAD outputs and preview dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          required = [
            'src/build_v006.py','src/validate_v006.py','src/render_v006.py',
            'step/COMPLETE_4040_ESP32_CAM_MB_ASSEMBLY_V006.step',
            'step/V006_wrist_adapter.step','step/V006_camera_shell.step',
            'stl/V006_wrist_adapter.stl','stl/V006_camera_shell.stl',
            'docs/manifest_v006.json','docs/validation_v006.json',
            'previews/v006_wrist_full_assembly.png',
            'previews/v006_wrist_and_cable_detail.png',
            'previews/v006_wrist_rotated_20deg.png']
          for item in required:
            p=Path(item); assert p.is_file() and p.stat().st_size>300,item
          data=json.loads(Path('docs/validation_v006.json').read_text())
          summary=data.get('summary',data)
          assert summary.get('tested_poses')==13,summary
          for p in Path('previews').glob('v006_*.png'):
            with Image.open(p) as im: im.verify()
          print('V006 complete and checks passed:',len(required),'required files')
          PY
      - name: Publish generated STEP/STL/PNG/JSON directly to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add step/COMPLETE_4040_ESP32_CAM_MB_ASSEMBLY_V006.step step/V006_wrist_adapter.step step/V006_camera_shell.step
          git add stl/V006_wrist_adapter.stl stl/V006_camera_shell.stl
          git add previews/v006_wrist_full_assembly.png previews/v006_wrist_and_cable_detail.png previews/v006_wrist_rotated_20deg.png
          git add docs/manifest_v006.json docs/validation_v006.json
          if git diff --cached --quiet; then
            echo "Generated artifacts are already up to date"
          else
            git commit -m "build(cad): publish verified V006 STEP STL PNG and JSON artifacts"
            git push origin HEAD:main
          fi
      - name: Upload full V006 CAD artifact as fallback
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-CAM-MB-V006-CAD
          if-no-files-found: error
          path: |
            step/COMPLETE_4040_ESP32_CAM_MB_ASSEMBLY_V006.step
            step/V006_*.step
            stl/V006_*.stl
            previews/v006_*.png
            docs/manifest_v006.json
            docs/validation_v006.json
